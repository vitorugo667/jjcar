services:
  - type: web
    name: jjcar-api
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @jjcar/db generate
    startCommand: pnpm --filter @jjcar/db migrate:deploy && pnpm --filter @jjcar/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://jjcar.vercel.app
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
